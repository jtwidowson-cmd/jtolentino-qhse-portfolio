<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries | Private</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-weight='bold'%3EJT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">

<header class="site-header">
  <div class="container header-inner">
    <span class="brand">JT<span>.3rDegre3</span></span>
    <div class="header-actions">
      <span id="admin-user" class="admin-user" hidden></span>
      <button id="admin-signout" class="btn btn-ghost btn-small" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>

<main id="top" class="page-main">
  <section class="page-hero">
    <div class="container">
      <h1>Enquiries</h1>
      <p class="page-lead">Private review area. Only the site owner can sign in. CVs are never sent automatically.</p>
    </div>
  </section>

  <!-- Sign in -->
  <section id="admin-login" class="section" hidden>
    <div class="container">
      <form id="login-form" class="access-form glass" novalidate>
        <div class="form-row">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required maxlength="320">
        </div>
        <div class="form-row">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required maxlength="200">
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary">Sign in</button>
        <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="admin-dashboard" class="section" hidden>
    <div class="container">
      <div class="admin-cv glass">
        <div>
          <h2 class="admin-h2">Private CV</h2>
          <p id="cv-status" class="admin-muted">Checking private storage…</p>
        </div>
        <div class="admin-cv-actions">
          <button id="cv-download" class="btn btn-secondary btn-small" type="button" hidden>Download my CV</button>
          <label class="btn btn-ghost btn-small admin-upload">
            Upload / replace CV
            <input id="cv-file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          </label>
        </div>
      </div>

      <div class="admin-toolbar">
        <div id="status-filters" class="filter-chips" role="group" aria-label="Filter by status"></div>
        <input id="admin-search" class="admin-search" type="search" placeholder="Search name, company, job title, location" aria-label="Search enquiries">
      </div>
      <p id="admin-status" class="form-status" role="status" aria-live="polite"></p>
      <ol id="enquiry-list" class="enquiry-list"></ol>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
